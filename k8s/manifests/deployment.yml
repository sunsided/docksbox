apiVersion: apps/v1
kind: Deployment
metadata:
  name: docksbox
  labels:
    app: docksbox
spec:
  # VNC sessions are stateful; do not load-balance multiple replicas.
  replicas: 1
  selector:
    matchLabels:
      app: docksbox
  template:
    metadata:
      labels:
        app: docksbox
    spec:
      containers:
        - name: docksbox
          image: ghcr.io/sunsided/docksbox:latest
          ports:
            - name: http
              containerPort: 80
